name: PR Checks

on:
  pull_request:
    branches:
      - main
    # Docs/skills-only PRs do not need macOS test+build.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.cursor/**'
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and Build App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: make test

      - name: Build unsigned app bundle
        run: make app

      - name: Verify app bundle exists
        run: |
          test -d "dist/CodexGateway.app"
          test -x "dist/CodexGateway.app/Contents/MacOS/CodexGateway"
